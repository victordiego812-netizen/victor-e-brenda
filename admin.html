<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contribuições Pix | Victor & Brenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=EB+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--iv:#f7f2e7;--iv2:#efe7d9;--ink:#2d2a24;--bd:#4f6f9f;--bn:#30486f;--g:#b4913a;--line:rgba(48,72,111,.16)}*{box-sizing:border-box}body{margin:0;background:var(--iv);color:var(--ink);font:18px/1.5 'EB Garamond',serif}.wrap{max-width:1000px;margin:0 auto;padding:28px 18px 60px}h1,h2{font-family:'Cormorant Garamond',serif;color:var(--bn);margin:0}h1{font-size:clamp(2.2rem,6vw,3.3rem)}.sub{color:var(--bd);margin:4px 0 24px}.panel{background:#fff;border:1px solid var(--line);padding:20px;margin:18px 0;box-shadow:0 12px 30px rgba(48,72,111,.06)}label{display:block;margin:10px 0 5px;color:var(--bn)}input{width:100%;padding:12px;border:1px solid var(--line);font:inherit}button{border:1px solid var(--g);background:var(--bn);color:#fff;padding:10px 16px;font:inherit;cursor:pointer;margin-top:12px}button:disabled{opacity:.5}.status{min-height:1.5em;color:var(--bd)}.stats{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0}.stat{background:var(--iv2);padding:12px 16px;min-width:150px}.stat strong{display:block;color:var(--bn);font:600 1.8rem 'Cormorant Garamond',serif}.list{display:grid;gap:10px}.item{border:1px solid var(--line);padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.item h2{font-size:1.35rem}.meta{color:var(--bd);font-size:.95rem}.amount{font:600 1.5rem 'Cormorant Garamond',serif;color:var(--bn);white-space:nowrap}.pill{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--bd)}.pill.confirmed{color:#2f6b4f}.item button{margin:5px 0 0}.hidden{display:none}@media(max-width:560px){.item{grid-template-columns:1fr}.amount{grid-row:1}.panel{padding:15px}}
</style></head>
<body><main class="wrap">
<div class="sub">Victor & Brenda · 10 de abril de 2027</div><h1>Contribuições via Pix</h1><p class="sub">Painel privado dos noivos. Os registros enviados pelos convidados começam como pendentes até conferirmos o extrato bancário.</p>
<section class="panel" id="loginPanel"><h2>Acesso dos noivos</h2><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required value="victordiego812@gmail.com"><label for="token">Token administrativo</label><input id="token" type="password" autocomplete="current-password" required placeholder="Token configurado na Vercel"><button type="submit">Acessar painel</button></form><p class="status" id="loginStatus" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="stats"><div class="stat">Registros<strong id="count">0</strong></div><div class="stat">Pendentes<strong id="pending">0</strong></div><div class="stat">Confirmados<strong id="confirmed">0</strong></div><div class="stat">Total confirmado<strong id="total">R$ 0,00</strong></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="refresh">Atualizar</button><button id="logout" style="background:transparent;color:var(--bn)">Sair</button></div><p class="status" id="listStatus" role="status"></p><div class="list" id="list"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let adminToken=sessionStorage.getItem('wedding_admin_token')||'',adminEmail='victordiego812@gmail.com';
function money(c){return (Number(c||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function call(action,extra={}){const r=await fetch('/api/contributions',{method:'POST',headers:{'content-type':'application/json',...(adminToken?{authorization:'Bearer '+adminToken}:{})},body:JSON.stringify({action,admin_email:adminEmail,...extra})});const x=await r.json();if(!r.ok)throw new Error(x.error||'Não foi possível concluir.');return x}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(rows){const pending=rows.filter(x=>x.status==='pending'),confirmed=rows.filter(x=>x.status==='confirmed');$('count').textContent=rows.length;$('pending').textContent=pending.length;$('confirmed').textContent=confirmed.length;$('total').textContent=money(confirmed.reduce((s,x)=>s+Number(x.amount_cents),0));$('list').innerHTML=rows.map(x=>'<article class="item"><div><h2>'+esc(x.donor_name)+'</h2><div>'+esc(x.gift_name)+'</div><div class="meta">'+new Date(x.created_at).toLocaleString('pt-BR')+'</div><div class="pill '+(x.status==='confirmed'?'confirmed':'')+'">'+(x.status==='confirmed'?'Pix conferido':'Pendente de conferência')+'</div><button data-id="'+esc(x.id)+'" data-action="'+(x.status==='confirmed'?'admin_unconfirm':'admin_confirm')+'">'+(x.status==='confirmed'?'Reabrir pendência':'Marcar como recebido')+'</button></div><div class="amount">'+money(x.amount_cents)+'</div></article>').join('')||'<p>Nenhuma contribuição registrada ainda.</p>';$('list').querySelectorAll('button[data-id]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;try{await call(b.dataset.action,{id:b.dataset.id});await load()}catch(e){$('listStatus').textContent=e.message;b.disabled=false}}))}
async function load(){ $('listStatus').textContent='Carregando contribuições...';try{const x=await call('admin_list');render(x.contributions||[]);$('listStatus').textContent='Dados atualizados.'}catch(e){$('listStatus').textContent=e.message;if(e.message.includes('restrito')){sessionStorage.removeItem('wedding_admin_token');adminToken='';$('dashboard').classList.add('hidden');$('loginPanel').classList.remove('hidden')}}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();adminEmail=$('email').value.trim().toLowerCase();adminToken=$('token').value;sessionStorage.setItem('wedding_admin_token',adminToken);$('loginStatus').textContent='Validando acesso...';try{await call('admin_list');$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('loginStatus').textContent='';await load()}catch(err){sessionStorage.removeItem('wedding_admin_token');adminToken='';$('loginStatus').textContent=err.message}});
$('refresh').addEventListener('click',load);$('logout').addEventListener('click',()=>{sessionStorage.removeItem('wedding_admin_token');adminToken='';$('dashboard').classList.add('hidden');$('loginPanel').classList.remove('hidden');$('token').value=''});
if(adminToken){$('token').value=adminToken;call('admin_list').then(()=>{$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');load()}).catch(()=>{sessionStorage.removeItem('wedding_admin_token');adminToken=''})}
</script></body></html>
