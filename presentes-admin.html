<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lista de presentes | Victor & Brenda</title><style>:root{--iv:#f7f2e7;--bn:#30486f;--g:#b4913a;--line:rgba(48,72,111,.18)}*{box-sizing:border-box}body{margin:0;background:var(--iv);color:#343a43;font:16px/1.5 Georgia,serif}.wrap{max-width:1000px;margin:auto;padding:28px 18px 70px}h1,h2{color:var(--bn);font-weight:500}h1{font-size:2.5rem}.panel,.item{background:#fffdf9;border:1px solid var(--line);padding:18px;margin:14px 0}label{display:block;color:var(--bn);margin:10px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid var(--line);font:inherit;background:white}button{padding:11px 16px;border:1px solid var(--g);background:var(--bn);color:white;cursor:pointer;margin:6px 6px 0 0}.muted{color:#64728a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{margin:0}.status{min-height:24px;color:var(--bn)}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><p class="muted">Victor & Brenda · 10.04.2027</p><h1>Gerenciar lista de presentes</h1><section class="panel" id="login"><label>E-mail</label><input id="email" type="email" value="victordiego812@gmail.com"><label>Token administrativo</label><input id="token" type="password" autocomplete="current-password"><button id="enter">Acessar</button><p class="status" id="loginStatus"></p></section><section id="app" hidden><div class="panel"><h2 id="formTitle">Adicionar presente</h2><input id="id" type="hidden"><label>Nome do presente</label><input id="name" maxlength="120" placeholder="Ex.: Jogo de panelas"><label>Descrição</label><textarea id="description" maxlength="500" rows="2"></textarea><label>Loja indicada</label><input id="store" placeholder="Ex.: Magazine Luiza"><label>Link do produto</label><input id="url" type="url" placeholder="https://..."><label>Link da foto (opcional)</label><input id="image" type="url" placeholder="https://..."><button id="save">Salvar presente</button><button id="clear" style="background:transparent;color:var(--bn)">Limpar</button><p class="status" id="formStatus"></p></div><h2>Catálogo</h2><div class="grid" id="gifts"></div><h2>Reservas dos convidados</h2><div id="reservations"></div></section></main><script>let token='';const $=id=>document.getElementById(id);async function call(action,data={}){const r=await fetch('/api/gifts-admin',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({action,admin_email:'victordiego812@gmail.com',...data})});const x=await r.json();if(!r.ok)throw Error(x.error||'Falha');return x}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clear(){['id','name','description','store','url','image'].forEach(x=>$(x).value='');$('formTitle').textContent='Adicionar presente'}function edit(g){$('id').value=g.id;$('name').value=g.name;$('description').value=g.description||'';$('store').value=g.store_name||'';$('url').value=g.store_url||'';$('image').value=g.image_url||'';$('formTitle').textContent='Editar presente: '+g.name;window.scrollTo({top:0,behavior:'smooth'})}async function load(){const x=await call('list');$('gifts').innerHTML=x.gifts.map(g=>'<article class="item"><strong>'+esc(g.name)+'</strong><p class="muted">'+esc(g.store_name||'Sem loja indicada')+'</p><button data-edit="'+g.id+'">Editar</button></article>').join('');$('gifts').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(x.gifts.find(g=>g.id===b.dataset.edit)));$('reservations').innerHTML=x.reservations.map(r=>'<article class="item"><strong>'+esc(r.gift?.name||'Presente')+'</strong><p>'+esc(r.invitee?.display_name||r.purchaser_name||'Convidado')+' · '+(r.reservation_method==='online'?'Compra online informada':'Vai levar pessoalmente')+' · '+esc(r.status)+'</p>'+(r.status==='reserved'?'<button data-done="'+r.id+'">Marcar como recebido</button><button data-cancel="'+r.id+'" style="background:transparent;color:var(--bn)">Cancelar reserva</button>':'')+'</article>').join('')||'<p class="muted">Nenhuma reserva ainda.</p>';$('reservations').querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{await call('reservation',{id:b.dataset.done,status:'gifted'});load()});$('reservations').querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{await call('reservation',{id:b.dataset.cancel,status:'cancelled'});load()})}$('enter').onclick=async()=>{token=$('token').value;try{await call('list');$('login').hidden=true;$('app').hidden=false;load()}catch(e){$('loginStatus').textContent=e.message}};$('save').onclick=async()=>{try{await call('save',{id:$('id').value||null,name:$('name').value,description:$('description').value,store_name:$('store').value,store_url:$('url').value,image_url:$('image').value});$('formStatus').textContent='Presente salvo.';clear();load()}catch(e){$('formStatus').textContent=e.message}};$('clear').onclick=clear;</script></body></html>
